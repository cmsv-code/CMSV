name: cmsv
channels:
  - pytorch
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python version
  - python=3.9

  # Core deep learning (PyTorch)
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - pytorch-cuda=12.1  # For CUDA 12.x (compatible with your CUDA 12.4)

  # Scientific computing
  - numpy>=1.21.0
  - pandas>=1.3.0
  - scipy>=1.7.0

  # Machine learning utilities
  - scikit-learn>=1.0.0

  # Bioinformatics
  - pysam>=0.19.0

  # Visualization and logging
  - tensorboard>=2.9.0
  - matplotlib>=3.5.0

  # Development tools
  - tqdm>=4.62.0

  # Additional dependencies via pip (Mamba模型特定依赖)
  - pip
  - pip:
    - mamba-ssm  # Mamba state space model
    - causal-conv1d  # Mamba dependency
